# Source registry for the Global Food System Observatory.
#
# Every connector reads its endpoint from here, and the website's "How this was
# built" page shows these entries with their live status. Nothing is added here
# until someone has actually fetched it and read its licence.
#
# status:            candidate | documented | prototype_connector |
#                    validated_connector | paused | retired
# redistribution:    may_republish | attribution_only | link_only | unknown
#                    The release build refuses to publish a download for any
#                    source that is not may_republish or attribution_only.
# stale_after_days:  how old the newest observation may be before the site says
#                    the source is older than expected. Set from the provider's
#                    normal publication rhythm plus a margin, never from how
#                    often we check.

sources:
  - id: FAO-TM
    provider: Food and Agriculture Organization of the United Nations
    dataset: "Trade: Detailed trade matrix (bulk download)"
    documentation_url: https://www.fao.org/faostat/en/#data/TM
    endpoint: https://bulks-faostat.fao.org/production/Trade_DetailedTradeMatrix_E_All_Data_(Normalized).zip
    catalogue_endpoint: https://bulks-faostat.fao.org/production/datasets_E.json
    access_type: bulk_zip_csv
    licence: Creative Commons Attribution 4.0 International (CC BY 4.0)
    licence_url: https://www.fao.org/contact-us/terms/db-terms-of-use/en/
    redistribution: attribution_only
    evidence_class: observation
    expected_frequency: annual
    stale_after_days: 500
    plain_name: Who buys wheat from whom
    caveat: >-
      FAO fills gaps for non-reporting countries using the trading partner's
      figures. Every row we publish carries FAO's own flag, so a reader can see
      whether a number was reported by that country or estimated for it.
    status: validated_connector

  - id: FAO-SUA
    provider: Food and Agriculture Organization of the United Nations
    dataset: "Food Balances: Supply Utilization Accounts, 2010 onwards (bulk download)"
    documentation_url: https://www.fao.org/faostat/en/#data/SCL
    endpoint: https://bulks-faostat.fao.org/production/SUA_Crops_Livestock_E_All_Data_(Normalized).zip
    catalogue_endpoint: https://bulks-faostat.fao.org/production/datasets_E.json
    access_type: bulk_zip_csv
    licence: Creative Commons Attribution 4.0 International (CC BY 4.0)
    licence_url: https://www.fao.org/contact-us/terms/db-terms-of-use/en/
    redistribution: attribution_only
    evidence_class: observation
    expected_frequency: annual
    stale_after_days: 500
    plain_name: Where each country's wheat comes from and goes
    caveat: >-
      Opening stocks are FAO estimates for most countries. They are the best
      open figures available, and they are not a count of what is in store.
    status: validated_connector

  - id: FAO-CP
    provider: Food and Agriculture Organization of the United Nations
    dataset: "Prices: Consumer Price Indices (bulk download)"
    documentation_url: https://www.fao.org/faostat/en/#data/CP
    endpoint: https://bulks-faostat.fao.org/production/ConsumerPriceIndices_E_All_Data_(Normalized).zip
    catalogue_endpoint: https://bulks-faostat.fao.org/production/datasets_E.json
    access_type: bulk_zip_csv
    licence: Creative Commons Attribution 4.0 International (CC BY 4.0)
    licence_url: https://www.fao.org/contact-us/terms/db-terms-of-use/en/
    redistribution: attribution_only
    evidence_class: observation
    expected_frequency: monthly
    stale_after_days: 120
    plain_name: What food costs in the shops, month by month
    caveat: >-
      Compiled by FAO from IMF and national statistics offices. Countries
      report at different speeds, so the newest month differs by country.
    status: validated_connector

  - id: FAO-CAHD
    provider: Food and Agriculture Organization of the United Nations
    dataset: Cost and Affordability of a Healthy Diet (bulk download)
    documentation_url: https://www.fao.org/faostat/en/#data/CAHD
    endpoint: https://bulks-faostat.fao.org/production/Cost_Affordability_Healthy_Diet_(CoAHD)_E_All_Data_(Normalized).zip
    catalogue_endpoint: https://bulks-faostat.fao.org/production/datasets_E.json
    access_type: bulk_zip_csv
    licence: Creative Commons Attribution 4.0 International (CC BY 4.0)
    licence_url: https://www.fao.org/contact-us/terms/db-terms-of-use/en/
    redistribution: attribution_only
    evidence_class: observation
    expected_frequency: annual
    stale_after_days: 500
    plain_name: How many people cannot afford a healthy diet
    caveat: >-
      Modelled from retail prices and income distributions, not from a survey
      of households. It shows what a healthy diet would cost against what
      people earn, which is not the same as asking people what they ate.
    status: validated_connector

  - id: WB-PINK
    provider: World Bank
    dataset: Commodity Markets monthly price data (the "Pink Sheet")
    documentation_url: https://www.worldbank.org/en/research/commodity-markets
    endpoint: https://thedocs.worldbank.org/en/doc/5d903e848db1d1b83e0ec8f744e55570-0350012021/related/CMO-Historical-Data-Monthly.xlsx
    access_type: xlsx_download
    licence: Creative Commons Attribution 4.0 International (CC BY 4.0)
    licence_url: https://www.worldbank.org/en/about/legal/terms-of-use-for-datasets
    redistribution: attribution_only
    evidence_class: observation
    expected_frequency: monthly
    stale_after_days: 70
    plain_name: World wheat, fertilizer and energy prices each month
    caveat: >-
      These are world reference prices. They are not the price any particular
      buyer paid, and they are not the price in any shop.
    status: validated_connector

  - id: WB-IND
    provider: World Bank
    dataset: World Development Indicators (Indicators API)
    documentation_url: https://datahelpdesk.worldbank.org/knowledgebase/articles/889392
    endpoint: https://api.worldbank.org/v2
    access_type: rest_json
    licence: Creative Commons Attribution 4.0 International (CC BY 4.0)
    licence_url: https://www.worldbank.org/en/about/legal/terms-of-use-for-datasets
    redistribution: attribution_only
    evidence_class: observation
    expected_frequency: annual
    stale_after_days: 800
    plain_name: Foreign currency reserves, imports and population
    caveat: >-
      National figures. A country holding plenty of foreign currency does not
      mean its households can afford food.
    status: validated_connector

# Considered and not used in this first version. Each entry says why, so the
# next person does not repeat the work.
not_used:
  - id: UN-COMTRADE
    provider: United Nations Statistics Division
    reason: >-
      The free tier returns a few hundred records per request at about one
      request a second, and UN Comtrade restricts passing its data on to
      others. A global wheat trade matrix cannot be built inside that budget,
      and we could not republish it if it could. FAOSTAT's trade matrix covers
      the same ground under a licence that lets us publish what we use.
    revisit_when: An institutional licence that permits public redistribution is in place.
  - id: USDA-PSD
    provider: USDA Foreign Agricultural Service
    reason: >-
      Needs a free api.data.gov key. It is the only open source of
      stocks-to-use for the major exporters, so it is the first thing to add.
    revisit_when: Phase 2.
  - id: GEOGLAM
    provider: GEOGLAM Crop Monitor
    reason: >-
      The crop-condition assessment is the right source for the growing-season
      stage of the chain, which this version honestly leaves unwatched.
    revisit_when: Phase 2.
